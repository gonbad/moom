# Merge with compose.yaml using the SAME --project-name and environment file.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.app
    environment:
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:?Set DB_NAME}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${APP_PORT:?Allocate the VPS application port}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
